<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2527" />
      <stop offset="100%" stop-color="#181516" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5C2D" />
      <stop offset="100%" stop-color="#E04500" />
    </linearGradient>
  </defs>
  
  <!-- Fondo con textura sutil -->
  <rect width="400" height="500" fill="url(#bgGrad)" />
  <circle cx="200" cy="210" r="140" fill="#FF5C2D" opacity="0.05" />
  
  <!-- Silueta estilizada de Kitesurf / Instructor -->
  <g transform="translate(140, 130)" stroke="url(#orangeGrad)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cabeza -->
    <circle cx="60" cy="35" r="24" fill="#2a2527" />
    <!-- Hombros y torso -->
    <path d="M15 110 C15 75, 40 68, 60 68 C80 68, 105 75, 105 110" />
    <!-- Cometa / Barra minimalista -->
    <path d="M10 20 L110 20" stroke-width="2" opacity="0.4" />
    <path d="M60 20 L60 -20" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.3" />
    <path d="M40 -35 Q60 -50 80 -35 Q60 -38 40 -35 Z" fill="#FF5C2D" opacity="0.6" stroke="none" />
  </g>
  
  <!-- Badge Foto Pendiente -->
  <g transform="translate(115, 290)">
    <rect width="170" height="30" rx="15" fill="#363032" stroke="#484043" stroke-width="1" />
    <text x="85" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FEFEFE" opacity="0.8" text-anchor="middle" letter-spacing="0.05em">FOTO PRÓXIMAMENTE</text>
  </g>
  
  <text x="200" y="350" font-family="'Anton', Impact, sans-serif" font-size="20" fill="#FEFEFE" opacity="0.9" text-anchor="middle" letter-spacing="0.05em">RAMIRO OREIRO</text>
  <text x="200" y="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FF5C2D" text-anchor="middle" letter-spacing="0.08em">KITESURF // WINGFOIL</text>
</svg>
